services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SKYFLIP_CACHE_DIR=/data/cache
    volumes:
      - skyflip_cache:/data/cache
    # Frontend is a static Vite build served separately in Phase 1+.

volumes:
  skyflip_cache:
